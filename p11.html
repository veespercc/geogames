<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>§ 12. Географическая база данных</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090d;
      --panel: #0f131a;
      --panel-2: #161c28;
      --hairline: #1f283a;
      --ink: #f0f4f8;
      --ink-muted: #8393a7;
      --accent: #00d285;
      --accent-soft: rgba(0, 210, 133, 0.15);
      --cyan: #38bdf8;
      --font-ui: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .nav { height: 52px; background: var(--panel); border-bottom: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; }
    .nav-left { display: flex; align-items: center; gap: 1rem; }
    .back-btn { color: var(--ink-muted); text-decoration: none; font-size: 0.85rem; font-family: var(--font-mono); }
    .back-btn:hover { color: var(--accent); }
    .nav-title { font-size: 0.9rem; font-weight: 600; border-left: 1px solid var(--hairline); padding-left: 1rem; }
    
    .tabs { display: flex; gap: 4px; }
    .tab-btn { background: transparent; border: 1px solid transparent; color: var(--ink-muted); padding: 6px 14px; border-radius: 6px; font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; }
    .tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(0,210,133,0.3); font-weight: 600; }
    
    .workspace { flex: 1; display: grid; grid-template-columns: 360px 1fr; overflow: hidden; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--hairline); padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; overflow-y: auto; }
    .viewport { position: relative; background: #05070a; display: flex; flex-direction: column; }
    
    .step-badge { font-family: var(--font-mono); font-size: 0.75rem; color: var(--cyan); text-transform: uppercase; }
    .task-title { font-size: 1.15rem; font-weight: 600; }
    .task-desc { font-size: 0.85rem; color: var(--ink-muted); line-height: 1.5; }
    
    .tool-box { background: var(--panel-2); border: 1px solid var(--hairline); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .tool-label { font-size: 0.75rem; font-family: var(--font-mono); color: var(--ink-muted); text-transform: uppercase; }
    
    .btn { background: var(--panel-2); border: 1px solid var(--hairline); color: var(--ink); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.active { background: var(--accent); color: #000; font-weight: 600; }
    
    .attr-row { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; }
    .attr-row span { color: var(--ink-muted); font-family: var(--font-mono); }
    .attr-row input { background: var(--bg); border: 1px solid var(--hairline); color: #fff; padding: 6px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.8rem; }
    
    .map-canvas-wrap { flex: 1; position: relative; cursor: crosshair; }
    canvas { width: 100%; height: 100%; display: block; }
    
    .telemetry-bar { height: 36px; background: var(--panel); border-top: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-muted); }
    .feedback-banner { padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; display: none; }
    .feedback-success { background: rgba(0, 210, 133, 0.15); border: 1px solid var(--accent); color: #4ade80; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <a href="index.html" class="back-btn">← ПОРТАЛ</a>
      <div class="nav-title">§ 12. Географическая база данных</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTask(1)">ЗАДАНИЕ 1: ОЦИФРОВКА</button>
      <button class="tab-btn" onclick="switchTask(2)">ЗАДАНИЕ 2: АТРИБУТИВНАЯ КАРТОЧКА</button>
      <button class="tab-btn" onclick="switchTask(3)">ЗАДАНИЕ 3: ВЫБОР БАЗОВОЙ ОСНОВЫ</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="step-badge" id="task-badge">ЭТАП 1 ИЗ 3</div>
      <h2 class="task-title" id="task-title">Векторная оцифровка местности</h2>
      <p class="task-desc" id="task-desc">Классифицируйте объекты правильными примитивами: Точка (скважина), Линия (дорога), Полигон (озеро).</p>

      <div class="tool-box" id="task-controls"></div>
      <div id="feedback" class="feedback-banner"></div>
    </aside>

    <main class="viewport">
      <div class="map-canvas-wrap">
        <canvas id="gis-canvas"></canvas>
      </div>
      <div class="telemetry-bar">
        <div>СТРУКТУРА: Пространственные (2D/3D) + Атрибутивные (Семантические)</div>
        <div style="color:var(--cyan);">СУБД: РАСПРЕДЕЛЕННАЯ БД</div>
      </div>
    </main>
  </div>

  <script>
    let currentTask = 1;
    const canvas = document.getElementById('gis-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    // Task 1: Digitizing
    let t1_tool = 'point'; // 'point' | 'line' | 'polygon'
    let t1_done = { point: false, line: false, polygon: false };

    // Task 2: Attributes
    let t2_saved = false;

    // Task 3: Base Map Selection
    let t3_selectedBase = null; // 'admin' | 'cadastral' | 'landscape'

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = width = rect.width;
      canvas.height = height = rect.height;
      render();
    }
    window.addEventListener('resize', resize);

    function switchTask(taskId) {
      currentTask = taskId;
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === taskId - 1));
      const controls = document.getElementById('task-controls');
      const badge = document.getElementById('task-badge');
      const title = document.getElementById('task-title');
      const desc = document.getElementById('task-desc');
      const fb = document.getElementById('feedback');
      fb.style.display = 'none';

      if (taskId === 1) {
        badge.innerText = 'ЭТАП 1 ИЗ 3';
        title.innerText = 'Векторная оцифровка местности';
        desc.innerText = 'Выберите инструмент (Точка, Линия, Полигон) и оцифруйте соответствующий объект на карте.';
        controls.innerHTML = `
          <div class="tool-label">Геометрический примитив</div>
          <div style="display:flex; gap:6px;">
            <button class="btn ${t1_tool==='point'?'active':''}" onclick="setT1Tool('point')">Точка</button>
            <button class="btn ${t1_tool==='line'?'active':''}" onclick="setT1Tool('line')">Линия</button>
            <button class="btn ${t1_tool==='polygon'?'active':''}" onclick="setT1Tool('polygon')">Полигон</button>
          </div>
        `;
      } else if (taskId === 2) {
        badge.innerText = 'ЭТАП 2 ИЗ 3';
        title.innerText = 'Атрибутивная привязка объектов БД';
        desc.innerText = 'Заполните трехмерную модель характеристик объекта (Пространство, Время, Тематика) и сохраните запись в СУБД.';
        controls.innerHTML = `
          <div class="tool-label">Карточка географического объекта</div>
          <div class="attr-row">
            <span>ПРОСТРАНСТВЕННЫЕ ДАННЫЕ (X, Y):</span>
            <input type="text" value="51°10' N, 71°26' E (Астана)" readonly>
          </div>
          <div class="attr-row">
            <span>ВРЕМЕННАЯ ХАРАКТЕРИСТИКА:</span>
            <input type="text" id="attr-date" value="2026-09-28 10:00 UTC">
          </div>
          <div class="attr-row">
            <span>ТЕМАТИЧЕСКАЯ (СЕМАНТИЧЕСКАЯ):</span>
            <input type="text" id="attr-theme" value="Озеро Тенгиз, минерализация соленая">
          </div>
          <button class="btn" style="margin-top:6px;" onclick="saveAttr()">Сохранить в БД</button>
        `;
      } else if (taskId === 3) {
        badge.innerText = 'ЭТАП 3 ИЗ 3';
        title.innerText = 'Выбор базовой карты';
        desc.innerText = 'Задача: «Учет границ земельных участков и прав собственности». Выберите подходящую базовую основу из классификатора.';
        controls.innerHTML = `
          <div class="tool-label">Тип базовой карты</div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <button class="btn ${t3_selectedBase==='admin'?'active':''}" onclick="selectBase('admin')">Карта административного деления</button>
            <button class="btn ${t3_selectedBase==='cadastral'?'active':''}" onclick="selectBase('cadastral')">Кадастровая карта и планы</button>
            <button class="btn ${t3_selectedBase==='landscape'?'active':''}" onclick="selectBase('landscape')">Ландшафтная карта</button>
          </div>
        `;
      }
      render();
    }

    function setT1Tool(t) { t1_tool = t; switchTask(1); }

    function saveAttr() {
      t2_saved = true;
      const fb = document.getElementById('feedback');
      fb.className = 'feedback-banner feedback-success';
      fb.style.display = 'block';
      fb.innerText = '✓ Атрибутивная запись успешно согласована со структурой базы данных ГИС!';
      render();
    }

    function selectBase(b) {
      t3_selectedBase = b;
      const fb = document.getElementById('feedback');
      fb.style.display = 'block';
      if (b === 'cadastral') {
        fb.className = 'feedback-banner feedback-success';
        fb.innerText = '✓ Верно! Кадастровая карта является единственной юридически точной основой для учета прав на землю.';
      } else {
        fb.className = 'feedback-banner';
        fb.style.background = 'rgba(245, 158, 11, 0.15)';
        fb.style.color = '#fbbf24';
        fb.innerText = 'Выбранная основа не содержит границ земельных участков. Выберите кадастровую основу.';
      }
      switchTask(3);
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;

      if (currentTask === 1) {
        if (t1_tool === 'point' && Math.hypot(cx - 200, cy - 180) < 30) {
          t1_done.point = true;
        } else if (t1_tool === 'line' && Math.hypot(cx - 380, cy - 300) < 40) {
          t1_done.line = true;
        } else if (t1_tool === 'polygon' && Math.hypot(cx - 520, cy - 180) < 50) {
          t1_done.polygon = true;
        }

        if (t1_done.point && t1_done.line && t1_done.polygon) {
          const fb = document.getElementById('feedback');
          fb.className = 'feedback-banner feedback-success';
          fb.style.display = 'block';
          fb.innerText = '✓ Все три векторных типа данных (Точка, Линия, Полигон) успешно оцифрованы!';
        }
        render();
      }
    });

    function render() {
      ctx.clearRect(0, 0, width, height);

      if (currentTask === 1) {
        // Точечный объект
        ctx.fillStyle = t1_done.point ? '#00d285' : '#64748b';
        ctx.beginPath(); ctx.arc(200, 180, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '11px JetBrains Mono';
        ctx.fillText('Скважина (Point) ' + (t1_done.point?'[✓]':'[Кликните Точкой]'), 140, 210);

        // Линейный объект
        ctx.strokeStyle = t1_done.line ? '#00d285' : '#64748b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(280, 340);
        ctx.lineTo(480, 260);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fillText('Дорога (Line) ' + (t1_done.line?'[✓]':'[Кликните Линией]'), 320, 320);

        // Полигон
        ctx.fillStyle = t1_done.polygon ? 'rgba(0, 210, 133, 0.3)' : 'rgba(100, 116, 139, 0.2)';
        ctx.strokeStyle = t1_done.polygon ? '#00d285' : '#64748b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(520, 180, 60, 40, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fillText('Озеро (Polygon) ' + (t1_done.polygon?'[✓]':'[Кликните Полигоном]'), 460, 185);

      } else if (currentTask === 2) {
        // Полигон озера
        ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(400, 240, 140, 80, 0.1, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#bae6fd';
        ctx.font = '12px JetBrains Mono';
        ctx.fillText('ОБЪЕКТ БД: Озеро Тенгиз', 340, 235);
        ctx.fillText('Координаты: 51°10\' N, 71°26\' E', 320, 255);

        if (t2_saved) {
          ctx.fillStyle = '#00d285';
          ctx.fillText('[СТАТУС: АТРИБУТЫ СИНХРОНИЗИРОВАНЫ]', 300, 280);
        }
      } else if (currentTask === 3) {
        if (t3_selectedBase === 'cadastral') {
          // Сетка кадастровых участков
          for (let x = 180; x < 580; x += 100) {
            for (let y = 100; y < 380; y += 80) {
              ctx.strokeStyle = '#00d285';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(x, y, 95, 75);
              ctx.fillStyle = '#a7f3d0';
              ctx.font = '10px JetBrains Mono';
              ctx.fillText(`УЧ. 01:${Math.floor(x/10)}:${Math.floor(y/10)}`, x + 6, y + 20);
            }
          }
          ctx.fillStyle = '#fff';
          ctx.font = '12px Inter';
          ctx.fillText('Кадастровая основа: границы участков согласованы', 220, 60);
        } else {
          ctx.fillStyle = '#64748b';
          ctx.font = '13px Inter';
          ctx.fillText('Выберите базовую карту на панели слева для визуализации основы.', 180, 240);
        }
      }
    }

    resize();
    switchTask(1);
  </script>
</body>
</html>
