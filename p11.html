<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>§ 11. ГИС в отраслях («Цифровой Казахстан»)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090c; --panel: #0f131a; --panel-2: #161c26;
      --hairline: #1f2736; --ink: #f0f4f8; --ink-muted: #8594a6;
      --accent: #00d285; --accent-soft: rgba(0, 210, 133, 0.15);
      --cyan: #38bdf8; --warn: #f59e0b;
      --font-ui: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    .nav { min-height: 52px; background: var(--panel); border-bottom: 1px solid var(--hairline); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; gap: 0.5rem; }
    .nav-left { display: flex; align-items: center; gap: 0.75rem; }
    .back-btn { color: var(--ink-muted); text-decoration: none; font-size: 0.8rem; font-family: var(--font-mono); padding: 4px 8px; border-radius: 4px; background: var(--panel-2); }
    .nav-title { font-size: 0.85rem; font-weight: 600; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; width: 100%; padding-bottom: 2px; }
    @media(min-width: 768px) { .tabs { width: auto; } }
    .tab-btn { background: transparent; border: 1px solid transparent; color: var(--ink-muted); padding: 8px 12px; border-radius: 6px; font-family: var(--font-mono); font-size: 0.75rem; cursor: pointer; white-space: nowrap; min-height: 40px; }
    .tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(0,210,133,0.3); font-weight: 600; }
    .workspace { flex: 1; display: grid; grid-template-columns: 1fr; }
    @media(min-width: 860px) { .workspace { grid-template-columns: 340px 1fr; height: calc(100vh - 52px); overflow: hidden; } }
    .sidebar { background: var(--panel); border-right: 1px solid var(--hairline); padding: 1rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
    .viewport { position: relative; background: #050608; display: flex; flex-direction: column; min-height: 380px; }
    .step-badge { font-family: var(--font-mono); font-size: 0.7rem; color: var(--cyan); text-transform: uppercase; }
    .task-title { font-size: 1.1rem; font-weight: 600; }
    .task-desc { font-size: 0.85rem; color: var(--ink-muted); line-height: 1.45; }
    .tool-box { background: var(--panel-2); border: 1px solid var(--hairline); border-radius: 8px; padding: 0.85rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .tool-label { font-size: 0.7rem; font-family: var(--font-mono); color: var(--ink-muted); text-transform: uppercase; }
    .btn { background: var(--panel-2); border: 1px solid var(--hairline); color: var(--ink); padding: 10px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500; min-height: 42px; display: inline-flex; align-items: center; justify-content: center; }
    .btn:active, .btn.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }
    .map-canvas-wrap { flex: 1; position: relative; width: 100%; min-height: 340px; touch-action: none; cursor: crosshair; }
    canvas { width: 100%; height: 100%; display: block; }
    .telemetry-bar { background: var(--panel); border-top: 1px solid var(--hairline); padding: 0.5rem 1rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; }
    .feedback-banner { padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.8rem; display: none; }
    .feedback-success { background: rgba(0, 210, 133, 0.15); border: 1px solid var(--accent); color: #4ade80; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <a href="index.html" class="back-btn">← МЕНЮ</a>
      <div class="nav-title">§ 11. ГИС в отраслях экономики</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTask(1)">1. ТРАССИРОВКА</button>
      <button class="tab-btn" onclick="switchTask(2)">2. СЕЛЬХОЗУГОДИЯ</button>
      <button class="tab-btn" onclick="switchTask(3)">3. ER MAPPER</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="step-badge" id="task-badge">ЭТАП 1 ИЗ 3</div>
      <h2 class="task-title" id="task-title">Трассировка логистического коридора</h2>
      <p class="task-desc" id="task-desc">Проложите маршрут трубопровода от Хаба А до Хаба Б в обход Заповедника.</p>
      <div class="tool-box" id="task-controls"></div>
      <div id="feedback" class="feedback-banner"></div>
    </aside>

    <main class="viewport">
      <div class="map-canvas-wrap">
        <canvas id="gis-canvas"></canvas>
      </div>
      <div class="telemetry-bar">
        <div>ГОСПРОГРАММА: «Цифровой Казахстан»</div>
        <div style="color:var(--cyan)">ER MAPPER: ГОТОВ К СЪЕМКЕ</div>
      </div>
    </main>
  </div>

  <script>
    const V_WIDTH = 800, V_HEIGHT = 500;
    let currentTask = 1;
    const canvas = document.getElementById('gis-canvas');
    const ctx = canvas.getContext('2d');
    let scale = 1, offsetX = 0, offsetY = 0;

    let t1_route = [];
    let t2_filterApplied = false;
    let t2_parcels = [
      { id: 1, name: 'Участок №101 (Пшеница)', vx: 180, vy: 160, unused: false, checked: false },
      { id: 2, name: 'Участок №102 (НЕИСПОЛЬЗУЕТСЯ)', vx: 380, vy: 180, unused: true, checked: false },
      { id: 3, name: 'Участок №103 (Пастбище)', vx: 260, vy: 340, unused: false, checked: false },
      { id: 4, name: 'Участок №104 (НЕИСПОЛЬЗУЕТСЯ)', vx: 540, vy: 300, unused: true, checked: false }
    ];
    let t3_mineralFilter = false;
    let t3_anomalies = [
      { vx: 320, vy: 220, drilled: false, val: 'Медно-порфировое рудное тело' },
      { vx: 520, vy: 160, drilled: false, val: 'Высокоминерализованный очаг' }
    ];

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const scaleX = rect.width / V_WIDTH;
      const scaleY = rect.height / V_HEIGHT;
      scale = Math.min(scaleX, scaleY);
      offsetX = (rect.width - V_WIDTH * scale) / 2;
      offsetY = (rect.height - V_HEIGHT * scale) / 2;
      ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offsetX * dpr, offsetY * dpr);
      render();
    }
    window.addEventListener('resize', resize);

    function toVirtual(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        vx: (clientX - rect.left - offsetX) / scale,
        vy: (clientY - rect.top - offsetY) / scale
      };
    }

    function switchTask(taskId) {
      currentTask = taskId;
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === taskId - 1));
      const controls = document.getElementById('task-controls');
      const badge = document.getElementById('task-badge');
      const title = document.getElementById('task-title');
      const desc = document.getElementById('task-desc');
      const fb = document.getElementById('feedback');
      fb.style.display = 'none';

      if (taskId === 1) {
        badge.innerText = 'ЭТАП 1 ИЗ 3';
        title.innerText = 'Трассировка логистического коридора';
        desc.innerText = 'Коснитесь точки ХАБ А, затем добавьте промежуточную контрольную точку в обход красного Заповедника и соедините с ХАБ Б.';
        controls.innerHTML = `<button class="btn" onclick="resetT1()">Сбросить трассировку</button>`;
      } else if (taskId === 2) {
        badge.innerText = 'ЭТАП 2 ИЗ 3';
        title.innerText = 'Детектор неиспользуемых пашен';
        desc.innerText = 'Включите спектральный спутниковый анализ и коснитесь выявленных красных участков для формирования кадастрового предписания.';
        controls.innerHTML = `<button class="btn ${t2_filterApplied?'active':''}" onclick="applyT2()">Спектральный анализ пашен</button>`;
      } else if (taskId === 3) {
        badge.innerText = 'ЭТАП 3 ИЗ 3';
        title.innerText = 'Разведка недр: ER Mapper';
        desc.innerText = 'Активируйте многозональный фильтр ER Mapper и отметьте точки бурения на высокоминерализованных аномалиях.';
        controls.innerHTML = `<button class="btn ${t3_mineralFilter?'active':''}" onclick="applyT3()">Фильтр ER Mapper</button>`;
      }
      render();
    }

    function resetT1() { t1_route = []; switchTask(1); }
    function applyT2() { t2_filterApplied = true; switchTask(2); }
    function applyT3() { t3_mineralFilter = true; switchTask(3); }

    canvas.addEventListener('pointerdown', (e) => {
      const { vx, vy } = toVirtual(e.clientX, e.clientY);

      if (currentTask === 1) {
        t1_route.push({ vx, vy });
        if (t1_route.length >= 3) {
          const fb = document.getElementById('feedback');
          fb.className = 'feedback-banner feedback-success';
          fb.style.display = 'block';
          fb.innerText = '✓ Оптимальный маршрут коридора успешно проложен в обход природоохранных зон!';
        }
      } else if (currentTask === 2) {
        if (!t2_filterApplied) return;
        t2_parcels.forEach(p => {
          if (Math.hypot(vx - p.vx, vy - p.vy) < 45) {
            p.checked = true;
            const fb = document.getElementById('feedback');
            fb.className = 'feedback-banner feedback-success';
            fb.style.display = 'block';
            fb.innerText = p.unused ? `✓ Выявлено нарушение: ${p.name}. Предписание отправлено собственнику.` : `Участок активен: ${p.name}.`;
          }
        });
      } else if (currentTask === 3) {
        if (!t3_mineralFilter) return;
        t3_anomalies.forEach(a => {
          if (Math.hypot(vx - a.vx, vy - a.vy) < 40) {
            a.drilled = true;
            const fb = document.getElementById('feedback');
            fb.className = 'feedback-banner feedback-success';
            fb.style.display = 'block';
            fb.innerText = `✓ Точка разведочного бурения зафиксирована: ${a.val}. Координаты внесены в базу недр.`;
          }
        });
      }
      render();
    });

    function render() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      if (currentTask === 1) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(380, 230, 90, 60, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fca5a5'; ctx.font = '12px Inter';
        ctx.fillText('ЗАПОВЕДНИК (ЗОНА ОТЧУЖДЕНИЯ)', 260, 235);

        ctx.fillStyle = '#00d285';
        ctx.beginPath(); ctx.arc(140, 330, 11, 0, Math.PI*2); ctx.fill();
        ctx.fillText('ХАБ А (Старт)', 110, 360);

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.arc(620, 140, 11, 0, Math.PI*2); ctx.fill();
        ctx.fillText('ХАБ Б (Финиш)', 590, 165);

        if (t1_route.length > 0) {
          ctx.strokeStyle = '#00d285'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(t1_route[0].vx, t1_route[0].vy);
          for (let i = 1; i < t1_route.length; i++) ctx.lineTo(t1_route[i].vx, t1_route[i].vy);
          ctx.stroke();
        }
      } else if (currentTask === 2) {
        t2_parcels.forEach(p => {
          ctx.fillStyle = !t2_filterApplied ? 'rgba(51, 65, 85, 0.5)' :
                          p.unused ? 'rgba(239, 68, 68, 0.35)' : 'rgba(16, 185, 129, 0.35)';
          ctx.strokeStyle = !t2_filterApplied ? '#475569' : p.unused ? '#ef4444' : '#10b981';
          ctx.lineWidth = 2;
          ctx.fillRect(p.vx - 55, p.vy - 35, 110, 70);
          ctx.strokeRect(p.vx - 55, p.vy - 35, 110, 70);

          ctx.fillStyle = '#fff'; ctx.font = '11px JetBrains Mono';
          ctx.fillText(`Кадастр №${p.id}`, p.vx - 45, p.vy - 10);
          if (t2_filterApplied) {
            ctx.fillStyle = p.unused ? '#fca5a5' : '#a7f3d0';
            ctx.fillText(p.unused ? 'НЕИСПОЛЬЗУЕТСЯ' : 'АКТИВЕН', p.vx - 45, p.vy + 12);
          }
        });
      } else if (currentTask === 3) {
        if (t3_mineralFilter) {
          t3_anomalies.forEach(a => {
            const grad = ctx.createRadialGradient(a.vx, a.vy, 10, a.vx, a.vy, 75);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.85)');
            grad.addColorStop(0.5, 'rgba(239, 68, 68, 0.4)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(a.vx, a.vy, 75, 0, Math.PI*2); ctx.fill();

            if (a.drilled) {
              ctx.strokeStyle = '#00d285'; ctx.lineWidth = 3;
              ctx.strokeRect(a.vx - 14, a.vy - 14, 28, 28);
              ctx.fillStyle = '#00d285'; ctx.font = '11px JetBrains Mono';
              ctx.fillText('СКВАЖИНА ✓', a.vx + 18, a.vy + 4);
            }
          });
        } else {
          ctx.fillStyle = '#64748b'; ctx.font = '13px Inter';
          ctx.fillText('Включите фильтр ER Mapper для визуализации спектральных аномалий.', 160, 240);
        }
      }
    }

    resize();
    switchTask(1);
  </script>
</body>
</html>
